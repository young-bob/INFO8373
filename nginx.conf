# ============================================
# Nginx - TLS Termination + Reverse Proxy + WASM
# ============================================

# HTTP -> HTTPS redirect (Phase 5 Task 5.2)
server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl;
    server_name localhost;

    # Self-signed TLS certificate (Phase 5 Task 5.2)
    ssl_certificate     /etc/nginx/ssl/securehub.crt;
    ssl_certificate_key /etc/nginx/ssl/securehub.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # HSTS - Force browsers to always use HTTPS (Phase 5 Task 5.2)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Serve Avalonia WASM static files
    root /usr/share/nginx/html;
    index index.html;

    # Required WASM MIME types
    types {
        application/wasm wasm;
        application/octet-stream dll;
        application/json json;
        application/javascript js;
        text/html html htm;
        text/css css;
        image/x-icon ico;
    }

    # Security: disable directory listing (Phase 7 hardening)
    autoindex off;

    # SPA fallback: all non-file routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy: /api/* -> backend container on port 8080
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # File upload support (match API's 15MB limit)
        client_max_body_size 15M;
    }
}
